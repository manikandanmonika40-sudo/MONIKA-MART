<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | MONIKA MART</title>
  <meta name="description" content="Create a new MONIKA MART account to shop premium products and track orders seamlessly.">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="offer-bar">
    <span>⚡ Join MONIKA MART &amp; get 10% off your first order!</span>
  </div>

  <!-- Main Auth Container -->
  <div class="auth-page">
    <div class="auth-card" style="max-width: 600px;">
      
      <div class="auth-header">
        <a href="index.html" class="brand-logo">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>MONIKA <span class="mart-text">MART</span></span>
        </a>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Fill in your information to start shopping</p>
      </div>

      <!-- Registration Form -->
      <form id="register-form">
        
        <div class="form-grid-2">
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name *</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-user input-icon"></i>
              <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address *</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-envelope input-icon"></i>
              <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="reg-phone" class="form-label">Phone Number</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-phone input-icon"></i>
              <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password" class="form-label">Password (min 6 chars) *</label>
            <div class="form-input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-address" class="form-label">Delivery Address</label>
          <div class="form-input-wrapper">
            <i class="fa-solid fa-house-chimney input-icon"></i>
            <input type="text" id="reg-address" class="form-control" placeholder="Apartment, Street address">
          </div>
        </div>

        <div class="form-grid-2" style="grid-template-columns: 1.2fr 1fr 1fr;">
          <div class="form-group">
            <label for="reg-city" class="form-label">City</label>
            <input type="text" id="reg-city" class="form-control" style="padding-left:1rem;" placeholder="City">
          </div>

          <div class="form-group">
            <label for="reg-state" class="form-label">State</label>
            <input type="text" id="reg-state" class="form-control" style="padding-left:1rem;" placeholder="State">
          </div>

          <div class="form-group">
            <label for="reg-pincode" class="form-label">Pincode</label>
            <input type="text" id="reg-pincode" class="form-control" style="padding-left:1rem;" placeholder="12345">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.25rem;">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>

      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
