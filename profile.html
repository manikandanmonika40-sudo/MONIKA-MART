<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | MONIKA MART</title>
  <meta name="description" content="Manage your MONIKA MART account settings, shipping address, and password.">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <button class="mobile-toggle-btn" aria-label="Toggle navigation menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <a href="index.html" class="brand-logo">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>MONIKA <span class="mart-text">MART</span></span>
          </a>
        </div>

        <div class="header-actions">
          <a href="wishlist.html" class="action-item" title="Wishlist">
            <i class="fa-regular fa-heart"></i>
            <span>Wishlist</span>
          </a>

          <a href="cart.html" class="action-item" title="Shopping Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
          </a>

          <div id="header-auth-container">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="drawer-overlay"></div>
  <div class="mobile-nav-drawer">
    <div class="drawer-header">
      <div class="brand-logo" style="font-size:1.3rem;">
        <i class="fa-solid fa-bag-shopping" style="width:34px; height:34px;"></i>
        <span>MONIKA MART</span>
      </div>
      <button class="drawer-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="drawer-links">
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="products.html"><i class="fa-solid fa-border-all"></i> All Products</a></li>
      <li><a href="wishlist.html"><i class="fa-regular fa-heart"></i> My Wishlist</a></li>
      <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> My Cart</a></li>
      <li><a href="orders.html"><i class="fa-solid fa-receipt"></i> My Orders</a></li>
      <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> My Profile</a></li>
    </ul>
  </div>

  <!-- Profile Content -->
  <main class="container" style="margin-top:2.5rem; margin-bottom:4rem;">
    
    <div style="display:grid; grid-template-columns:300px 1fr; gap:2.5rem; align-items:start;">
      
      <!-- Profile Sidebar Summary -->
      <div style="background:#ffffff; border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:2rem; text-align:center; box-shadow:var(--shadow-sm);">
        <div style="width:84px; height:84px; border-radius:50%; background:var(--primary-blue); color:#ffffff; font-size:2.2rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem; box-shadow:0 4px 12px rgba(37,99,235,0.3);">
          <i class="fa-solid fa-user"></i>
        </div>
        <h2 id="profile-display-name" style="font-size:1.35rem; font-weight:700; color:var(--navy-dark); margin-bottom:0.2rem;">User Name</h2>
        <p id="profile-display-email" style="font-size:0.88rem; color:var(--text-muted); margin-bottom:0.75rem;">email@example.com</p>
        <span id="profile-display-role" class="badge-pill" style="background:#e0f2fe; color:#0369a1; padding:3px 10px; border-radius:12px; font-weight:700; font-size:0.75rem;">USER</span>

        <div style="border-top:1px solid var(--border-light); margin-top:1.5rem; padding-top:1.5rem; display:grid; grid-template-columns:1fr 1fr; gap:1rem; text-align:center;">
          <div style="background:#f8fafc; padding:0.75rem; border-radius:var(--radius-md);">
            <span style="font-size:0.75rem; color:var(--text-muted); display:block;">Total Orders</span>
            <strong id="profile-orders-count" style="font-size:1.2rem; color:var(--navy-dark);">0</strong>
          </div>
          <div style="background:#f8fafc; padding:0.75rem; border-radius:var(--radius-md);">
            <span style="font-size:0.75rem; color:var(--text-muted); display:block;">Total Spent</span>
            <strong id="profile-total-spent" style="font-size:1.2rem; color:var(--primary-blue);">$0.00</strong>
          </div>
        </div>

        <button onclick="logoutUser()" class="btn btn-outline btn-block btn-sm" style="color:var(--danger); border-color:var(--border-light); margin-top:1.5rem;">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>

      <!-- Profile Edit Form -->
      <div style="background:#ffffff; border:1px solid var(--border-light); border-radius:var(--radius-lg); padding:2rem; box-shadow:var(--shadow-sm);">
        <h3 style="font-size:1.35rem; font-weight:700; color:var(--navy-dark); margin-bottom:1.5rem;">Account Information &amp; Address</h3>

        <form id="profile-edit-form">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem;">
            <div>
              <label class="form-label">Full Name</label>
              <input type="text" id="profile-name" class="form-control" style="padding-left:1rem;" required>
            </div>
            <div>
              <label class="form-label">Email (Cannot be changed)</label>
              <input type="email" id="profile-email" class="form-control" style="padding-left:1rem; background:#f8fafc;" disabled>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem;">
            <div>
              <label class="form-label">Phone Number</label>
              <input type="tel" id="profile-phone" class="form-control" style="padding-left:1rem;" placeholder="+1 (555) 000-0000">
            </div>
            <div>
              <label class="form-label">New Password (optional)</label>
              <input type="password" id="profile-new-password" class="form-control" style="padding-left:1rem;" placeholder="Leave blank to keep unchanged">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Street Address</label>
            <input type="text" id="profile-address" class="form-control" style="padding-left:1rem;" placeholder="House #, Street">
          </div>

          <div style="display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:1rem; margin-bottom:2rem;">
            <div>
              <label class="form-label">City</label>
              <input type="text" id="profile-city" class="form-control" style="padding-left:1rem;">
            </div>
            <div>
              <label class="form-label">State</label>
              <input type="text" id="profile-state" class="form-control" style="padding-left:1rem;">
            </div>
            <div>
              <label class="form-label">Pincode</label>
              <input type="text" id="profile-pincode" class="form-control" style="padding-left:1rem;">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg">
            <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 <strong>MONIKA MART</strong>. Profile data synchronized with MySQL.</div>
      <div style="display:flex; gap:1.5rem;">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
